name: premium worldwide count probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geosweep-premium-count
  cancel-in-progress: false

jobs:
  premium:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -q playwright
          .venv/bin/python -m playwright install chromium
      - name: Probe worldwide premium-only cache filter
        timeout-minutes: 6
        run: .venv/bin/python -u .github/scripts/premium-count.py
        env:
          GC_USER: ${{ secrets.GC_USER }}
          GC_PASS: ${{ secrets.GC_PASS }}
