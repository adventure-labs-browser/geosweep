name: world cache count

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geosweep-world-count
  cancel-in-progress: false

jobs:
  count:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser authentication runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -q playwright
          .venv/bin/python -m playwright install chromium

      - name: Count worldwide caches without crawling
        timeout-minutes: 5
        run: .venv/bin/python .github/scripts/world-count.py
        env:
          GC_USER: ${{ secrets.GC_USER }}
          GC_PASS: ${{ secrets.GC_PASS }}
