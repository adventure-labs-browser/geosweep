name: daily
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to crawl (local requires the geosweep-labeled Mac runner)"
        required: false
        default: hosted
        type: choice
        options:
          - hosted
          - local
      crawl_minutes:
        description: "Crawl budget in minutes (1-285; default 285)"
        required: false
        type: number
        default: 285

permissions:
  contents: write

concurrency:
  group: geosweep-daily
  cancel-in-progress: false

jobs:
  refresh:
    # Dispatch on a residential Mac, or set GEOSWEEP_RUNNER=local for schedules
    # after registering a geosweep-labeled self-hosted macOS ARM64 runner.
    # Both targets share geosweep-daily concurrency and the same DB release.
    runs-on: ${{ fromJSON((inputs.runner == 'local' || (github.event_name == 'schedule' && vars.GEOSWEEP_RUNNER == 'local')) && '["self-hosted","macOS","ARM64","geosweep"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    env:
      GC_RATE_SCOPE: ${{ (inputs.runner == 'local' || (github.event_name == 'schedule' && vars.GEOSWEEP_RUNNER == 'local')) && 'local' || 'hosted' }}
      GC_START_RATE: ${{ (inputs.runner == 'local' || (github.event_name == 'schedule' && vars.GEOSWEEP_RUNNER == 'local')) && '1.0' || '10.0' }}
      GC_CRAWL_MINUTES: ${{ inputs.crawl_minutes || '285' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Prepare native Mac runner dependencies
        if: runner.os == 'macOS'
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"
          command -v brew >/dev/null || { echo "::error::Homebrew required on local runner"; exit 1; }
          missing=()
          command -v gh >/dev/null || missing+=(gh)
          command -v zstd >/dev/null || missing+=(zstd)
          command -v gtimeout >/dev/null || missing+=(coreutils)
          if (("${#missing[@]}")); then brew install "${missing[@]}"; fi
          command -v gh && command -v zstd && command -v gtimeout

      - run: cargo build --release --locked

      - name: Restore database from rolling release
        run: |
          # Fail closed: a transient download/auth failure must never create
          # a fresh empty crawl that later overwrites the live checkpoint.
          mkdir -p data
          gh release download db-latest -p 'geosweep.db.zst' --clobber
          zstd -dc geosweep.db.zst -o data/geosweep.db
          rm -f geosweep.db.zst
          ls -lh data/geosweep.db
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Migrate database
        run: ./target/release/geosweep --db data/geosweep.db stats

      - name: Install browser auth runtime
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Homebrew Python is externally managed (PEP 668); use an isolated
            # environment and expose it to the Rust auth helper subprocess.
            python3 -m venv .venv
            .venv/bin/python -m pip install -q playwright
            .venv/bin/python -m playwright install chromium
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            attempt=0
            while true; do
              attempt=$((attempt + 1))
              if pip install -q playwright && python -m playwright install chromium --with-deps; then
                break
              fi
              wait=$((attempt * 10))
              if [ "$wait" -gt 60 ]; then wait=60; fi
              echo "browser runtime install attempt $attempt failed; retrying in ${wait}s" >&2
              sleep "$wait"
            done
          fi

      - name: Refresh pass
        id: refresh
        # The crawler stops itself at 4h45 and cancels/requeues any in-flight
        # search before returning success. The outer timeout is only a 5h15
        # emergency fuse; it still leaves ~40 minutes before the job ceiling
        # for validation, compression and release upload.
        run: |
          rm -f data/crawl-started
          if [[ ! "$GC_CRAWL_MINUTES" =~ ^[0-9]+$ ]] || (( GC_CRAWL_MINUTES < 1 || GC_CRAWL_MINUTES > 285 )); then
            echo "::error::crawl_minutes must be 1..285"; exit 1
          fi
          budget_secs=$((GC_CRAWL_MINUTES * 60))
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            deadline_cmd=gtimeout
          else
            deadline_cmd=timeout
          fi
          "$deadline_cmd" --preserve-status --signal=TERM --kill-after=5m 315m \
            env -u GC_BEARER -u GC_JAR \
            ./target/release/geosweep --db data/geosweep.db refresh \
              --crawl-rate "$GC_START_RATE" --crawl-budget-secs "$budget_secs"
        env:
          GC_AUTH_HELPER: .github/scripts/gc-login.py
          GC_BROWSER_STATE: gc-storage.json
          GC_CRAWL_STARTED_MARKER: data/crawl-started
          GC_USER: ${{ secrets.GC_USER }}
          GC_PASS: ${{ secrets.GC_PASS }}

      - name: Upload login screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gc-login-fail
          path: gc-login-fail.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate database before publish
        if: always()
        id: dbcheck
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import sqlite3, os, sys
          ok = False
          try:
              assert os.path.getsize('data/geosweep.db') > 100_000
              db = sqlite3.connect('data/geosweep.db', timeout=30)
              db.execute('PRAGMA busy_timeout=30000')
              assert db.execute('PRAGMA page_count').fetchone()[0] > 0
              tables = {r[0] for r in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'queue', 'caches', 'cache_versions', 'meta'}.issubset(tables)

              # No cell is ever skipped from the next run. At this point
              # the crawler is gone, so active leases are abandoned. Failed
              # pages (including from older versions that exhausted 429s)
              # must be retried too. next_skip survives both transitions.
              recovered = db.execute(
                  "UPDATE queue SET status='pending', updated_at=CURRENT_TIMESTAMP "
                  "WHERE status='in_progress'").rowcount
              retried_failed = db.execute(
                  "UPDATE queue SET status='pending', updated_at=CURRENT_TIMESTAMP "
                  "WHERE status='failed'").rowcount
              db.commit()

              # The release contains only geosweep.db, not -wal/-shm. Force
              # every committed WAL page into the main file before compression.
              busy, log, checkpointed = db.execute(
                  'PRAGMA wal_checkpoint(TRUNCATE)').fetchone()
              assert busy == 0, f'WAL checkpoint busy: log={log} checkpointed={checkpointed}'

              qfailed = db.execute("SELECT COUNT(*) FROM queue WHERE status='failed'").fetchone()[0]
              qpending = db.execute("SELECT COUNT(*) FROM queue WHERE status='pending'").fetchone()[0]
              qactive = db.execute("SELECT COUNT(*) FROM queue WHERE status='in_progress'").fetchone()[0]
              ncaches = db.execute('SELECT COUNT(*) FROM caches').fetchone()[0]
              assert qfailed == 0, f'{qfailed} cells were not requeued'
              assert qactive == 0, f'unclean checkpoint after lease recovery: {qactive} active'
              assert ncaches > 0, 'zero caches'
              complete = qpending == 0 and qfailed == 0
              # Initial OAuth failure leaves the baseline restored unchanged.
              # Don't disguise this by publishing that baseline a second time.
              crawl_started = os.path.isfile('data/crawl-started')
              print(f'crawl_started={str(crawl_started).lower()}')
              print(
                  f'checkpoint: caches={ncaches} pending={qpending} failed={qfailed} '
                  f'recovered_leases={recovered} retried_failed={retried_failed} complete={complete}',
                  file=sys.stderr)
              print(f'complete={str(complete).lower()}')
              print(f'recovered_leases={recovered}')
              print(f'retried_failed={retried_failed}')
              ok = True
          except Exception as e:
              print(f'validation failed: {e}', file=sys.stderr)
          print(f'valid={str(ok).lower()}')
          if not ok:
              sys.exit(1)
          PYEOF

      - name: Publish database to rolling release
        # Skip publish when initial authentication never completed, but keep
        # partial checkpoints from crawls that did start (including auth loss).
        if: always() && steps.dbcheck.outputs.valid == 'true' && steps.dbcheck.outputs.crawl_started == 'true'
        run: |
          zstd -T0 data/geosweep.db -o /tmp/geosweep.db.zst
          ls -lh /tmp/geosweep.db.zst
          TAG="db-$(date -u +%F)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/geosweep.db.zst --clobber
            gh release edit "$TAG" \
              --title "geosweep db $(date -u +%F)" \
              --notes "Dated snapshot/checkpoint, kept 7 days."
          else
            gh release create "$TAG" /tmp/geosweep.db.zst \
              --title "geosweep db $(date -u +%F)" \
              --notes "Dated snapshot/checkpoint, kept 7 days."
          fi
          if gh release view db-latest >/dev/null 2>&1; then
            gh release upload db-latest /tmp/geosweep.db.zst --clobber
            gh release edit db-latest \
              --title "geosweep db $(date -u +%F)" \
              --notes "Rolling database snapshot/checkpoint. Incomplete discovery resumes from saved page/cell checkpoints."
          else
            gh release create db-latest /tmp/geosweep.db.zst \
              --title "geosweep db $(date -u +%F)" \
              --notes "Rolling database snapshot/checkpoint. Incomplete discovery resumes from saved page/cell checkpoints."
          fi
          gh release list --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("db-20")) | .tagName] | sort | .[:-7] | .[]' \
            | while read -r t; do gh release delete "$t" -y --cleanup-tag || true; done
        env:
          GH_TOKEN: ${{ github.token }}
