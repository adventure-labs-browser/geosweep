name: daily
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geosweep-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Restore database from rolling release
        run: |
          mkdir -p data
          if gh release download db-latest -p 'geosweep.db.zst' --clobber; then
            zstd -dc geosweep.db.zst -o data/geosweep.db
            rm -f geosweep.db.zst
            ls -lh data/geosweep.db
          else
            echo "no db-latest release yet — starting from an empty database"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Migrate database
        run: ./target/release/geosweep --db data/geosweep.db stats

      - name: Install browser auth runtime
        run: |
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            if pip install -q playwright && python -m playwright install chromium --with-deps; then
              exit 0
            fi
            wait=$((attempt * 10))
            if [ "$wait" -gt 60 ]; then wait=60; fi
            echo "browser runtime install attempt $attempt failed; retrying in ${wait}s" >&2
            sleep "$wait"
          done

      - name: Prove auth recovery paths
        run: |
          rm -f gc-storage.json
          # This uses one Auth instance: first call must establish auth, then
          # force_refresh exercises the exact expiry/401 renewal path immediately.
          env -u GC_BEARER -u GC_JAR ./target/release/geosweep --db data/geosweep.db auth-browser
        env:
          GC_AUTH_HELPER: .github/scripts/gc-login.py
          GC_BROWSER_STATE: gc-storage.json
          GC_USER: ${{ secrets.GC_USER }}
          GC_PASS: ${{ secrets.GC_PASS }}

      - name: Refresh pass
        # The crawler stops itself at 4h45 and cancels/requeues any in-flight
        # search before returning success. The outer timeout is only a 5h15
        # emergency fuse; it still leaves ~40 minutes before the job ceiling
        # for validation, compression and release upload.
        run: |
          timeout --preserve-status --signal=TERM --kill-after=5m 315m \
            env -u GC_BEARER -u GC_JAR \
            ./target/release/geosweep --db data/geosweep.db refresh \
              --crawl-budget-secs 17100
        env:
          GC_AUTH_HELPER: .github/scripts/gc-login.py
          GC_BROWSER_STATE: gc-storage.json
          GC_USER: ${{ secrets.GC_USER }}
          GC_PASS: ${{ secrets.GC_PASS }}

      - name: Upload login screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gc-login-fail
          path: gc-login-fail.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate database before publish
        if: always()
        id: dbcheck
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import sqlite3, os, sys
          ok = False
          try:
              assert os.path.getsize('data/geosweep.db') > 100_000
              db = sqlite3.connect('data/geosweep.db', timeout=30)
              db.execute('PRAGMA busy_timeout=30000')
              assert db.execute('PRAGMA page_count').fetchone()[0] > 0
              tables = {r[0] for r in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'queue', 'caches', 'cache_versions', 'meta'}.issubset(tables)

              # At this point the crawler process is gone. Any remaining
              # in_progress row is an abandoned lease, not active work.
              # next_skip already points at the next uncommitted page.
              recovered = db.execute(
                  "UPDATE queue SET status='pending', updated_at=CURRENT_TIMESTAMP "
                  "WHERE status='in_progress'").rowcount
              db.commit()

              # The release contains only geosweep.db, not -wal/-shm. Force
              # every committed WAL page into the main file before compression.
              busy, log, checkpointed = db.execute(
                  'PRAGMA wal_checkpoint(TRUNCATE)').fetchone()
              assert busy == 0, f'WAL checkpoint busy: log={log} checkpointed={checkpointed}'

              qfailed = db.execute("SELECT COUNT(*) FROM queue WHERE status='failed'").fetchone()[0]
              qpending = db.execute("SELECT COUNT(*) FROM queue WHERE status='pending'").fetchone()[0]
              qactive = db.execute("SELECT COUNT(*) FROM queue WHERE status='in_progress'").fetchone()[0]
              ncaches = db.execute('SELECT COUNT(*) FROM caches').fetchone()[0]
              assert qfailed <= 5, f'{qfailed} failed cells (a few bad cells are tolerated, a wave is not)'
              assert qactive == 0, f'unclean checkpoint after lease recovery: {qactive} active'
              assert ncaches > 0, 'zero caches'
              complete = qpending == 0 and qfailed == 0
              print(
                  f'checkpoint: caches={ncaches} pending={qpending} failed={qfailed} '
                  f'recovered_leases={recovered} complete={complete}',
                  file=sys.stderr)
              print(f'complete={str(complete).lower()}')
              print(f'recovered_leases={recovered}')
              ok = True
          except Exception as e:
              print(f'validation failed: {e}', file=sys.stderr)
          print(f'valid={str(ok).lower()}')
          PYEOF

      - name: Publish database to rolling release
        if: always() && steps.dbcheck.outputs.valid == 'true'
        run: |
          zstd -T0 data/geosweep.db -o /tmp/geosweep.db.zst
          ls -lh /tmp/geosweep.db.zst
          TAG="db-$(date -u +%F)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/geosweep.db.zst --clobber
            gh release edit "$TAG" \
              --title "geosweep db $(date -u +%F)" \
              --notes "Dated snapshot/checkpoint, kept 7 days."
          else
            gh release create "$TAG" /tmp/geosweep.db.zst \
              --title "geosweep db $(date -u +%F)" \
              --notes "Dated snapshot/checkpoint, kept 7 days."
          fi
          if gh release view db-latest >/dev/null 2>&1; then
            gh release upload db-latest /tmp/geosweep.db.zst --clobber
            gh release edit db-latest \
              --title "geosweep db $(date -u +%F)" \
              --notes "Rolling database snapshot/checkpoint. Incomplete discovery resumes from saved page/cell checkpoints."
          else
            gh release create db-latest /tmp/geosweep.db.zst \
              --title "geosweep db $(date -u +%F)" \
              --notes "Rolling database snapshot/checkpoint. Incomplete discovery resumes from saved page/cell checkpoints."
          fi
          gh release list --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("db-20")) | .tagName] | sort | .[:-7] | .[]' \
            | while read -r t; do gh release delete "$t" -y --cleanup-tag || true; done
        env:
          GH_TOKEN: ${{ github.token }}
