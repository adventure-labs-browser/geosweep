<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>geosweep — worldwide geocaches</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root {--bg:#0d1117;--panel:#161b22;--panel2:#1c2430;--border:#30363d;
  --text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--good:#3fb950;--warn:#d29922}
* {box-sizing:border-box}
html,body {height:100%;margin:0;background:var(--bg);color:var(--text);
  font:13px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select {font:inherit}
button {cursor:pointer}
#app {display:flex;height:100%;overflow:hidden}
#side {width:380px;min-width:380px;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--border);z-index:5}
#hdr {padding:12px;border-bottom:1px solid var(--border)}
h1 {font-size:15px;letter-spacing:.4px;font-weight:600;margin:0}
h1 span {color:var(--accent)}
#stats {margin-top:5px;color:var(--dim);font-size:12px}
#search {width:100%;margin-top:9px;padding:8px 9px;border:1px solid var(--border);
  border-radius:6px;background:var(--panel2);color:var(--text);outline:none}
#search:focus {border-color:var(--accent)}
#quick {display:flex;gap:6px;margin-top:7px}
.mini-btn,.sortbtn {background:var(--panel2);border:1px solid var(--border);
  border-radius:5px;color:var(--dim);padding:5px 9px;font-size:11.5px}
.mini-btn:hover,.sortbtn:hover {color:var(--text);border-color:var(--accent)}
#fresh,#hint {color:var(--dim);font-size:11px;margin-top:6px}
#filters {display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--border);align-items:center}
#filters label {display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px}
#filters select,#filters input[type=number] {color:var(--text);background:var(--panel2);
  border:1px solid var(--border);border-radius:5px;padding:4px 5px}
#filters input[type=number] {width:54px}
#sortbar {display:flex;align-items:center;gap:5px;padding:8px 12px;
  border-bottom:1px solid var(--border);color:var(--dim);font-size:11px}
.sortbtn.on {border-color:var(--accent);color:var(--text)}
#count {margin-left:auto;text-align:right}
#list {flex:1;overflow:auto;min-height:0}
.item {display:block;width:100%;padding:10px 12px;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--border);color:var(--text)}
.item:hover,.item:focus-visible {background:var(--panel2);outline:none}
.item .title {font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item .subtitle {font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.empty {padding:18px 12px;color:var(--dim)}
#map {flex:1;min-width:0;position:relative}
#mapmode {position:absolute;top:10px;left:10px;z-index:5;display:flex;
  border:1px solid var(--border);background:var(--panel);border-radius:7px;overflow:hidden}
#mapmode button {border:0;background:transparent;color:var(--dim);padding:7px 11px;font-size:11.5px}
#mapmode button+button {border-left:1px solid var(--border)}
#mapmode button.on {background:var(--panel2);color:var(--text)}
#mapnote {position:absolute;bottom:34px;left:12px;z-index:5;color:var(--dim);
  background:rgba(22,27,34,.9);padding:5px 8px;border-radius:5px;pointer-events:none}
#drawer {position:absolute;top:0;right:0;bottom:0;width:440px;max-width:92vw;
  background:var(--panel);border-left:1px solid var(--border);z-index:10;
  transform:translateX(105%);transition:transform .2s ease;overflow:auto}
#drawer.open {transform:none}
#dhead {display:flex;position:sticky;top:0;align-items:center;gap:8px;
  background:var(--panel);border-bottom:1px solid var(--border);padding:12px 14px}
#dtitle {font-size:16px;font-weight:600;margin:0;flex:1;overflow-wrap:anywhere}
#dhead button {background:var(--panel2);color:var(--dim);
  border:1px solid var(--border);border-radius:5px;padding:5px 8px}
.dsec {padding:13px 14px;border-bottom:1px solid var(--border)}
.dsec h3 {font-size:11px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--dim);margin:0 0 12px;font-weight:500}
.kv {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 12px}
.kv .k {display:block;color:var(--dim);font-size:11px;margin-bottom:3px}
.kv div {overflow-wrap:anywhere}
a {color:var(--accent)}
#load {position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;
  align-items:center;justify-content:center;color:var(--dim)}
.maplibregl-ctrl-attrib {font-size:10px}
@media(max-width:800px) {#side {width:300px;min-width:300px}}
@media(max-width:600px) {
  #app {flex-direction:column-reverse}
  #side {width:100%;min-width:0;height:45%;border-right:0;border-top:1px solid var(--border)}
  #map {height:55%;flex:none}
  #hdr {padding:8px 10px}
  #filters {padding:6px 10px}
  #sortbar {padding:5px 10px}
  #drawer {width:100%;height:55%;bottom:auto;border-left:0;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header id="hdr">
      <h1>geo<span>sweep</span></h1>
      <div id="stats">loading database…</div>
      <input id="search" placeholder="search GC code, name, owner…" autocomplete="off" aria-label="Search geocaches">
      <div id="quick">
        <button class="mini-btn" id="near">near me</button>
        <button class="mini-btn" id="random">random visible</button>
        <button class="mini-btn" id="fit">world view</button>
      </div>
      <div id="fresh"></div>
      <div id="hint"></div>
    </header>
    <div id="filters">
      <label>type <select id="ftype">
        <option value="">all</option>
        <option value="2">traditional</option>
        <option value="3">multi-cache</option>
        <option value="8">mystery</option>
        <option value="137">earthcache</option>
        <option value="6">event</option>
        <option value="377">wherigo</option>
      </select></label>
      <label>D ≥ <input id="fminD" type="number" min="1" max="5" step=".5" placeholder="—"></label>
      <label>T ≥ <input id="fminT" type="number" min="1" max="5" step=".5" placeholder="—"></label>
      <label><input id="fcoords" type="checkbox" checked> coordinates</label>
    </div>
    <div id="sortbar">sort
      <button class="sortbtn on" data-sort="f">favorites</button>
      <button class="sortbtn" data-sort="n">name</button>
      <button class="sortbtn" data-sort="d">difficulty</button>
      <span id="count"></span>
    </div>
    <div id="list" aria-live="polite"><div class="empty">Zoom in to browse geocaches.</div></div>
  </aside>
  <main id="map" aria-label="Geocache map">
    <div id="mapmode">
      <button data-mode="cluster" class="on">clusters</button>
      <button data-mode="heat">heat</button>
      <button data-mode="all">points</button>
    </div>
    <div id="mapnote"></div>
  </main>
  <section id="drawer" aria-label="Geocache details">
    <div id="dhead"><h2 id="dtitle"></h2><button id="share">copy link</button><button id="close" aria-label="Close details">close</button></div>
    <div id="dbody"></div>
  </section>
  <div id="load">loading geosweep…</div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="points.js"></script>
<script src="app.js"></script>
</body>
</html>
